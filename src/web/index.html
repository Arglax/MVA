<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>MVA</title>
    <style>        @font-face { font-family: Inter; src: url(fonts/Inter.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
        .mva-aw, .mva-aw *:not(.tm), .mva-ap { font-family: Inter, system-ui, sans-serif !important; }
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
        #player { position: fixed; top: 0; bottom: 0; left: 0; right: 0; }
        #player ruffle-player { display: block; width: 100%; height: 100%; }
        #status { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); color: #C8B89A; font: 13px Inter, system-ui, sans-serif; pointer-events: none; z-index: 22; }</style>
</head>
<body>
    <div id="player"></div>
    <div id="status">Loading game...</div>
    <script src="overlays.js"></script>
    <script src="bridge.js"></script>
    <script src="guide.js"></script>
    <script src="about.js"></script>
    <script src="rails.js"></script>
    <script src="touchscroll.js"></script>
    <script src="chatscroll.js"></script>
    <script src="auraoverlay.js"></script>
    <script src="gameopts.js"></script>
    <script src="quick.js"></script>
    <script src="ruffle/ruffle.js"></script>
    <script>        MvaRails.init((name, ...args) => MvaBridge.swf(name, ...args));
        MvaBridge.boot();</script>
</body>
</html>
